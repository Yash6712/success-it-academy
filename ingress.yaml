{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "success-it-chart.fullname" . }}
  labels:
    {{- include "success-it-chart.labels" . | nindent 4 }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "success-it-chart.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}