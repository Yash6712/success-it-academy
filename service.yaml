apiVersion: v1
kind: Service

metadata:
  name: {{ include "success-it-chart.fullname" . }}
  labels:
    {{- include "success-it-chart.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "success-it-chart.selectorLabels" . | nindent 4 }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP